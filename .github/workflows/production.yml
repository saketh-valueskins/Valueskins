name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual deploy)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  staging-promotion-check:
    name: Staging Promotion Gate
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      staging_sha: ${{ steps.check.outputs.staging_sha }}
      prod_sha: ${{ steps.check.outputs.prod_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify code promoted from staging
        id: check
        run: |
          STAGING_SHA=$(git merge-base origin/develop HEAD 2>/dev/null || echo "no-develop-branch")
          PROD_SHA=${{ github.sha }}

          echo "staging_sha=$STAGING_SHA" >> $GITHUB_OUTPUT
          echo "prod_sha=$PROD_SHA" >> $GITHUB_OUTPUT

          echo "## Staging Promotion Check" >> $GITHUB_STEP_SUMMARY
          echo "Current HEAD: \`${PROD_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "Last common with develop: \`${STAGING_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY

          # Not blocking, just informational
          if [ "$STAGING_SHA" = "no-develop-branch" ]; then
            echo "⚠ No \`develop\` branch found — deploying directly to production" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Code verified against develop branch" >> $GITHUB_STEP_SUMMARY
          fi


  deploy-marketplace:
    name: Deploy Marketplace → Production
    needs: [staging-promotion-check]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.valueskins.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel CLI honors the project-level Root Directory (`.` for the
      # marketplace project). Running pull/build/deploy from the repository
      # root makes Vercel resolve package.json at the repo root (no Next.js),
      # so the Vercel commands run with their working directory set to
      # marketplace/ — which is exactly where a local `vercel --prod` runs.
      - name: Read Vercel project link
        id: vlink
        run: |
          echo "org=$(node -p "require('./marketplace/.vercel/project.json').orgId")" >> $GITHUB_OUTPUT
          echo "project=$(node -p "require('./marketplace/.vercel/project.json').projectId")" >> $GITHUB_OUTPUT

      - name: Pull Vercel Environment
        working-directory: marketplace
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}
        timeout-minutes: 5

      - name: Build Production
        working-directory: marketplace
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}
        timeout-minutes: 20

      - name: Deploy to Production
        working-directory: marketplace
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed marketplace to production: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Marketplace Production Deployed" >> $GITHUB_STEP_SUMMARY
          echo "[$URL]($URL)" >> $GITHUB_STEP_SUMMARY
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}
        timeout-minutes: 20

  # The Rust backend (backend/) was removed from the repo. The live frontend
  # hosts its own API routes; the optional backend-node service deploys via
  # deploy-render.yml when RENDER secrets are configured. This job only
  # triggers Render if the secrets exist, so the pipeline never hard-fails on
  # the stale cargo build.
  deploy-backend:
    name: Deploy Backend → Render (optional)
    needs: [staging-promotion-check]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render Production Deploy (if configured)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER secrets not configured — skipping backend deploy (marketplace hosts its own API routes)"
            echo "Skipped (no RENDER secrets)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "doNotClear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          echo "## Backend Production Deploy Triggered" >> $GITHUB_STEP_SUMMARY
          echo "Render dashboard: https://dashboard.render.com" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Smoke Test Production
    needs: [deploy-marketplace, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for rollout
        run: sleep 60

      # www.valueskins.com is the canonical app URL (see commit
      # 4538b781 "chore: make www.valueskins.com the canonical app URL").
      - name: Test marketplace (www.valueskins.com)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://www.valueskins.com)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Marketplace returned $HTTP_CODE — possible rollback needed"
            exit 1
          fi
          echo "Marketplace: ✅ ($HTTP_CODE)"

      # valueskins.com 308-redirects to https://www.valueskins.com. Follow the
      # redirect so a healthy response (200) is what we assert on.
      - name: Test apex redirect (valueskins.com)
        run: |
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" https://valueskins.com)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "valueskins.com returned $HTTP_CODE (expected 200 via redirect)"
            exit 1
          fi
          echo "Apex: ✅ ($HTTP_CODE after redirect)"

      # marketplace.valueskins.com and api.valueskins.com have no DNS records
      # configured, so they are intentionally non-blocking warnings.
      - name: Check optional hosts (non-blocking)
        run: |
          for HOST in "https://marketplace.valueskins.com" "https://api.valueskins.com/health"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HOST" || echo "000")
            if [ "$CODE" = "000" ]; then
              echo "⚠ $HOST — no DNS / not reachable (non-blocking)"
            else
              echo "$HOST → $CODE"
            fi
          done

      - name: Production Summary
        run: |
          echo "# ✅ Production Environment Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace | https://www.valueskins.com | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Apex redirect | https://valueskins.com | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | https://api.valueskins.com/health | ⚠ not configured |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Deployed by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  tag-release:
    name: Tag Release
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          TAG="v$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          git tag -a "$TAG" -m "Production release $TAG"
          git push origin "$TAG"
          echo "## Release Tagged" >> $GITHUB_STEP_SUMMARY
          echo "\`$TAG\`" >> $GITHUB_STEP_SUMMARY
