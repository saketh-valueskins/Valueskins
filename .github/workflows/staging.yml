name: Staging Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  staging-frontend:
    name: Deploy Frontend → Staging
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.valueskins.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build Staging
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy to Staging
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed frontend to staging: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Frontend Staging Deployed" >> $GITHUB_STEP_SUMMARY
          echo "[$URL]($URL)" >> $GITHUB_STEP_SUMMARY
        working-directory: frontend
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}

  staging-marketplace:
    name: Deploy Marketplace → Staging
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-marketplace.valueskins.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Canonical Vercel CI pattern: run from repo root with ORG/PROJECT IDs
      # in env (read from the committed marketplace/.vercel/project.json), so
      # Vercel links to the right project and applies Root Directory=marketplace
      # exactly once. Running inside marketplace/ previously doubled the path
      # (marketplace/marketplace/package.json) and failed.
      - name: Read Vercel project link
        id: vlink
        run: |
          echo "org=$(node -p "require('./marketplace/.vercel/project.json').orgId")" >> $GITHUB_OUTPUT
          echo "project=$(node -p "require('./marketplace/.vercel/project.json').projectId")" >> $GITHUB_OUTPUT

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}

      - name: Build Staging
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}

      - name: Deploy to Staging
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed marketplace to staging: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Marketplace Staging Deployed" >> $GITHUB_STEP_SUMMARY
          echo "[$URL]($URL)" >> $GITHUB_STEP_SUMMARY
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}

  staging-backend:
    name: Deploy Backend → Staging (Render)
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Trigger Render Staging Deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "doNotClear"}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}/deploys"
        continue-on-error: true

      - name: Build Docker image (staging)
        run: |
          docker build -t valueskins-api:staging -f backend/Dockerfile backend
          echo "Backend staging image built: valueskins-api:staging"
          echo "## Backend Staging" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`valueskins-api:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "Render: https://api-staging.valueskins.com/health" >> $GITHUB_STEP_SUMMARY

  staging-verify:
    name: Verify Staging
    needs: [staging-frontend, staging-marketplace, staging-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments
        run: sleep 30

      - name: Health check frontend
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://staging.valueskins.com \
            || echo "Frontend staging not ready yet"

      - name: Health check backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://api-staging.valueskins.com/health \
            || echo "Backend staging not ready yet"

      - name: Staging Summary
        run: |
          echo "# ✅ Staging Environment Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://staging.valueskins.com | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace | https://staging-marketplace.valueskins.com | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | https://api-staging.valueskins.com/health | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
