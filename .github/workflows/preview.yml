name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID_FRONTEND: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
  VERCEL_PROJECT_ID_MARKETPLACE: ${{ secrets.VERCEL_PROJECT_ID_MARKETPLACE }}

jobs:
  preview-frontend:
    name: Preview Frontend
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed frontend preview: $URL"
        working-directory: frontend

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployed\n\n**Frontend**: [${url}](${url})\n\n_This preview auto-updates on each push._`
            });

  preview-marketplace:
    name: Preview Marketplace
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: marketplace

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: marketplace

      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed marketplace preview: $URL"
        working-directory: marketplace

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🛒 Marketplace Preview\n\n**Marketplace**: [${url}](${url})`
            });

  preview-backend:
    name: Preview Backend
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend (preview)
        working-directory: backend
        run: cargo build --release -p api_gateway

      - name: Preview summary
        run: |
          echo "## Preview Backend" >> $GITHUB_STEP_SUMMARY
          echo "Backend built from PR #${{ github.event.number }} (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "Deploy to Render preview env: https://dashboard.render.com/select-repo?ref=${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  status-check:
    name: Preview Status
    needs: [preview-frontend, preview-marketplace, preview-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "## Preview Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.preview-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace | ${{ needs.preview-marketplace.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.preview-backend.result }} |" >> $GITHUB_STEP_SUMMARY
