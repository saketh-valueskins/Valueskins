name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  preview-marketplace:
    name: Preview Marketplace
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The Vercel project's Root Directory is "." (see fb84021a), so the
      # pull/build/deploy steps must run from marketplace/ -- the same as
      # production.yml. Run from the repo root they build the root package.json
      # and fail with "No Next.js version detected". ORG/PROJECT IDs come from
      # the committed marketplace/.vercel/project.json.
      - name: Read Vercel project link
        id: vlink
        run: |
          echo "org=$(node -p "require('./marketplace/.vercel/project.json').orgId")" >> $GITHUB_OUTPUT
          echo "project=$(node -p "require('./marketplace/.vercel/project.json').projectId")" >> $GITHUB_OUTPUT

      - name: Pull Vercel Environment
        working-directory: marketplace
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}

      - name: Build Project
        working-directory: marketplace
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}

      - name: Deploy Preview
        id: deploy
        working-directory: marketplace
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed marketplace preview: $URL"
        env:
          VERCEL_ORG_ID: ${{ steps.vlink.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vlink.outputs.project }}

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🛒 Marketplace Preview\n\n**Marketplace**: [${url}](${url})`
            });

  status-check:
    name: Preview Status
    needs: [preview-marketplace]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "## Preview Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace | ${{ needs.preview-marketplace.result }} |" >> $GITHUB_STEP_SUMMARY
