# Render Blueprint — Valueskins Backend
# Deploy: render blueprint apply
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── API Gateway (Node.js + Express) ────────────────────────────────────
  - type: web
    name: valueskins-api
    runtime: docker
    repo: https://github.com/saketh-valueskins/Valueskins
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: valueskins-db
          property: databaseUrl
      - key: REDIS_URL
        fromService:
          name: valueskins-redis
          property: redisUrl
      - key: ALLOWED_ORIGINS
        value: https://valueskins.com,https://www.valueskins.com,https://www.valueskins.local
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health/live
    autoDeploy: true
    dockerfilePath: ./backend-node/Dockerfile
    dockerContext: .
    plan: starter
    autoScaling:
      minInstances: 1
      maxInstances: 3

  # ── PostgreSQL ────────────────────────────────────────────────────────
  - type: pgsql
    name: valueskins-db
    database: valueskins
    ipAllowList: []   # internal Render services only

  # ── Redis (sessions + cache + pub/sub) ────────────────────────────────
  - type: redis
    name: valueskins-redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # internal Render services only
