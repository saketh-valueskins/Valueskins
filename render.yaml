# Render Blueprint — Valueskins Backend
# Deploy: render blueprint apply
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── API Gateway (Docker) ──────────────────────────────────────────────
  - type: web
    name: valueskins-api
    runtime: image
    image:
      url: # set after first push to Render registry, or use Docker Hub
    envVars:
      - key: RUST_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: valueskins-db
          property: databaseUrl
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_HMAC_SALT
        generateValue: true
      - key: VERIFICATION_HMAC_SECRET
        generateValue: true
      - key: PLATFORM_SIGNING_KEY_ED25519
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: valueskins-redis
          property: redisUrl
      - key: ALLOWED_ORIGINS
        value: https://valueskins.com,https://www.valueskins.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@valueskins.io
    healthCheckPath: /health/live
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # Scale up when CPU > 70%
    autoScaling:
      minInstances: 1
      maxInstances: 3
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 10

  # ── PostgreSQL ────────────────────────────────────────────────────────
  - type: postgres
    name: valueskins-db
    ipAllowList: []   # internal Render services only

  # ── Redis (sessions + cache + pub/sub) ────────────────────────────────
  - type: redis
    name: valueskins-redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # internal Render services only
