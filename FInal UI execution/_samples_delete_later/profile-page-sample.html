<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValueSkins — Profile (sample)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --vs-near-black:#0A0A0A;--vs-off-white:#F5F5F0;--vs-warm-sand:#C8B89A;
    --vs-charcoal:#2D2D2D;--vs-deep-sand:#A08A5E;--vs-muted-grey:#B8B4AC;
    --avatar:#E8E6E0;
    --hair:rgba(160,138,94,0.22);
    --hair-soft:rgba(160,138,94,0.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    background:var(--vs-off-white);color:var(--vs-charcoal);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }

  /* ---- top nav (no pill) ---- */
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 40px;border-bottom:1px solid var(--hair-soft);
  }
  .nav-word{font-weight:700;font-size:22px;letter-spacing:0.16em;color:var(--vs-near-black);}
  .nav-links{display:flex;align-items:center;gap:28px;}
  .nav-links a{font-size:15px;font-weight:500;color:var(--vs-charcoal);text-decoration:none;}
  .nav-links a:hover{color:var(--vs-near-black);}
  .btn-quiet{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:9px 18px;border-radius:6px;border:1px solid var(--hair);
    background:transparent;color:var(--vs-near-black);
  }
  .btn-quiet:hover{border-color:rgba(160,138,94,0.5);}
  .btn-danger{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:9px 18px;border-radius:6px;border:1px solid rgba(45,45,45,0.35);
    background:transparent;color:var(--vs-charcoal);
  }
  .btn-danger:hover{border-color:var(--vs-charcoal);}

  /* ---- layout ---- */
  .wrap{max-width:820px;margin:44px auto;padding:0 24px;}
  .card{
    border:1px solid var(--hair);border-radius:14px;
    padding:36px 40px;margin-bottom:26px;background:var(--vs-off-white);
  }

  /* ---- identity block ---- */
  .identity{display:flex;gap:34px;align-items:flex-start;}
  .avatar-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;}
  .avatar{
    width:120px;height:120px;border-radius:50%;background:var(--avatar);
    display:flex;align-items:center;justify-content:center;
  }
  .avatar svg{width:66px;height:66px;}
  .role-note{
    font-size:12px;font-weight:500;letter-spacing:0.09em;
    color:var(--vs-muted-grey);text-transform:uppercase;
  }

  .info{flex:1;padding-top:4px;}
  .name-row{display:flex;align-items:center;gap:10px;}
  .name{font-size:28px;font-weight:700;color:var(--vs-near-black);letter-spacing:0.01em;}
  .vskin{width:28px;height:28px;image-rendering:pixelated;display:block;}
  .email{margin-top:6px;font-size:15px;color:var(--vs-muted-grey);}
  .id-actions{margin-top:16px;}

  .stats{
    display:flex;gap:56px;margin-top:30px;padding-top:26px;
    border-top:1px solid var(--hair-soft);
  }
  .stat .num{font-size:26px;font-weight:700;color:var(--vs-near-black);}
  .stat .lab{margin-top:6px;font-size:13px;color:var(--vs-muted-grey);}

  /* ---- account card ---- */
  .sec-label{
    font-size:12px;font-weight:700;letter-spacing:0.09em;
    color:var(--vs-muted-grey);text-transform:uppercase;margin-bottom:20px;
  }
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 0;border-bottom:1px solid var(--hair-soft);
  }
  .row:last-of-type{border-bottom:none;}
  .row .k{font-size:15px;color:var(--vs-charcoal);}
  .row .v{font-size:15px;font-weight:500;color:var(--vs-near-black);}
  .delete-block{
    margin-top:22px;width:100%;padding:15px;border-radius:8px;
    border:1px solid rgba(45,45,45,0.28);background:transparent;
    font-family:inherit;font-size:15px;font-weight:600;color:var(--vs-charcoal);
    cursor:pointer;
  }
  .delete-block:hover{border-color:var(--vs-charcoal);}
</style>
</head>
<body>

  <nav>
    <div class="nav-word">VALUESKINS</div>
    <div class="nav-links">
      <a href="#">Profile</a>
      <a href="#">Settings</a>
      <button class="btn-quiet">Logout</button>
      <button class="btn-danger">Delete Account</button>
    </div>
  </nav>

  <div class="wrap">

    <!-- Identity card -->
    <div class="card">
      <div class="identity">
        <div class="avatar-col">
          <div class="avatar">
            <!-- default profile silhouette -->
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="32" cy="24" r="13" fill="#B8B4AC"/>
              <path d="M10 56c0-12.15 9.85-22 22-22s22 9.85 22 22" fill="#B8B4AC"/>
            </svg>
          </div>
          <div class="role-note">Brand</div>
        </div>

        <div class="info">
          <div class="name-row">
            <span class="name">Anshul</span>
            <!-- ValueSkin badge: pixelized software engineer w/ laptop (sample placeholder) -->
            <svg class="vskin" viewBox="0 0 12 12" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ValueSkin badge">
              <rect x="4" y="1" width="4" height="1" fill="#0A0A0A"/>
              <rect x="3" y="2" width="6" height="1" fill="#0A0A0A"/>
              <rect x="3" y="3" width="6" height="1" fill="#2D2D2D"/>
              <rect x="4" y="4" width="4" height="1" fill="#0A0A0A"/>
              <rect x="2" y="5" width="8" height="1" fill="#2D2D2D"/>
              <rect x="1" y="6" width="10" height="1" fill="#2D2D2D"/>
              <rect x="1" y="7" width="10" height="1" fill="#0A0A0A"/>
              <rect x="2" y="8" width="8" height="1" fill="#A08A5E"/>
              <rect x="1" y="9" width="10" height="1" fill="#A08A5E"/>
              <rect x="3" y="10" width="6" height="1" fill="#C8B89A"/>
            </svg>
          </div>
          <div class="email">redhand756@gmail.com</div>
          <div class="id-actions"><button class="btn-quiet">Edit Profile</button></div>

          <div class="stats">
            <div class="stat"><div class="num">0</div><div class="lab">Deals Done</div></div>
            <div class="stat"><div class="num">0.0 ★</div><div class="lab">Rating</div></div>
            <div class="stat"><div class="num">$0.0K</div><div class="lab">Spent</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Account card -->
    <div class="card">
      <div class="sec-label">Account</div>
      <div class="row"><span class="k">Email</span><span class="v">redhand756@gmail.com</span></div>
      <div class="row"><span class="k">Role</span><span class="v">Brand</span></div>
      <div class="row"><span class="k">Member since</span><span class="v">Jul 2026</span></div>
      <button class="delete-block">Delete Account</button>
    </div>

  </div>

</body>
</html>
