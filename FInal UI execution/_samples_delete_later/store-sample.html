<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValueSkins — Closet / Store (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --near-black:#0A0A0A;--off-white:#F5F5F0;--warm-sand:#C8B89A;--charcoal:#2D2D2D;
    --deep-sand:#A08A5E;--muted:#B8B4AC;--ease:cubic-bezier(0.16,1,0.3,1);
    --hair:rgba(160,138,94,0.26);--hair-soft:rgba(160,138,94,0.15);
  }
  [data-theme="light"]{
    --bg:linear-gradient(135deg,#F5F5F0 0%,#F1EDE3 60%,#ECE6D9 100%);
    --text:#2D2D2D;--head:#0A0A0A;--field:#FFFDF9;--divider:rgba(160,138,94,0.18);--chrome:rgba(245,245,240,0.72);
    --tile-hover:rgba(200,184,154,0.10);--cta-bg:#0A0A0A;--cta-text:#F5F5F0;
  }
  [data-theme="dark"]{
    --bg:radial-gradient(60% 50% at 88% 0%,rgba(160,138,94,0.15),transparent 70%),linear-gradient(135deg,#0A0A0A 0%,#1C1B18 58%,#2D2D2D 100%);
    --text:#D8D4CC;--head:#F5F5F0;--field:rgba(245,245,240,0.04);--divider:rgba(245,245,240,0.12);--chrome:rgba(10,10,10,0.6);
    --tile-hover:rgba(200,184,154,0.08);--cta-bg:#F5F5F0;--cta-text:#0A0A0A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100dvh;}
  body{font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;
    background:var(--bg);background-attachment:fixed;color:var(--text);transition:background .4s var(--ease),color .3s;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:18px 40px;background:var(--chrome);backdrop-filter:blur(10px);border-bottom:1px solid var(--divider);}
  .word{font-weight:700;font-size:22px;letter-spacing:.16em;color:var(--head);}
  .nav{display:flex;align-items:center;gap:22px;}
  .nav a{font-size:15px;font-weight:500;color:var(--text);text-decoration:none;}.nav a:hover{color:var(--head);}
  .b-quiet{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:9px 16px;border-radius:6px;border:1px solid var(--divider);background:transparent;color:var(--head);}
  .b-quiet:hover{border-color:var(--hair);}
  .toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--divider);border-radius:20px;padding:6px 12px;}
  .toggle .dw{width:26px;height:14px;border-radius:8px;background:var(--muted);position:relative;transition:background .3s;}
  .toggle .kb{position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--off-white);transition:transform .3s var(--ease);}
  [data-theme="dark"] .toggle .dw{background:var(--deep-sand);}[data-theme="dark"] .toggle .kb{transform:translateX(12px);}

  .wrap{max-width:1160px;margin:0 auto;padding:46px 40px 120px;}
  h1{font-size:34px;font-weight:700;color:var(--head);letter-spacing:-.01em;}
  .sub{margin-top:8px;font-size:15px;color:var(--muted);}

  /* search */
  .search{margin:28px 0 8px;position:relative;}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;}
  .search input{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:var(--field);
    border:1px solid var(--hair);border-radius:10px;padding:14px 16px 14px 44px;transition:border-color .15s,box-shadow .15s,background .3s;}
  .search input::placeholder{color:var(--muted);}
  .search input:focus{outline:none;border-color:var(--deep-sand);box-shadow:0 0 0 3px rgba(160,138,94,0.16);}

  /* section label */
  .sl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:40px 0 18px;display:flex;align-items:center;gap:12px;}
  .sl::after{content:"";flex:1;height:1px;background:var(--divider);}

  /* closet — owned collectible cards */
  .closet{display:flex;gap:18px;flex-wrap:wrap;}
  .skin-card{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:16px;min-width:300px;
    background:linear-gradient(160deg,#0A0A0A 0%,#161512 100%);border:1px solid rgba(200,184,154,0.24);
    box-shadow:0 24px 50px -26px rgba(10,10,10,0.5);color:#F5F5F0;transition:transform .2s var(--ease);}
  .skin-card:hover{transform:translateY(-2px);}
  .skin-av{width:60px;height:60px;image-rendering:pixelated;flex:none;background:rgba(245,245,240,0.05);border-radius:12px;padding:8px;}
  .skin-meta .nm{font-size:17px;font-weight:700;color:#F5F5F0;}
  .skin-meta .cat{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-top:3px;text-transform:uppercase;}
  .equipped{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-sand);}
  .equipped .d{width:6px;height:6px;border-radius:50%;background:var(--warm-sand);animation:breathe 2.6s var(--ease) infinite;}
  @keyframes breathe{0%,100%{opacity:.4;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}
  .add-slot{display:flex;align-items:center;justify-content:center;min-width:200px;border:1px dashed var(--hair);border-radius:16px;color:var(--muted);font-size:14px;cursor:pointer;transition:border-color .2s,color .2s;}
  .add-slot:hover{border-color:var(--deep-sand);color:var(--head);}

  /* browse grid — airy hairline tiles */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tile{border:1px solid var(--divider);border-radius:12px;overflow:hidden;background:transparent;transition:background .18s var(--ease),border-color .18s,transform .12s;}
  .tile:hover{background:var(--tile-hover);border-color:var(--hair);}
  .tile.owned{border-left:2px solid var(--warm-sand);}
  .thead{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;cursor:pointer;}
  .thead:active{transform:scale(.996);}
  .tname{font-size:16px;font-weight:600;color:var(--head);}
  .tright{display:flex;align-items:center;gap:14px;}
  .tcount{font-size:13px;color:var(--muted);}
  .owned-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--deep-sand);}
  .owned-badge .d{width:6px;height:6px;border-radius:50%;background:var(--warm-sand);}
  .chev{color:var(--muted);transition:transform .25s var(--ease);font-size:14px;}
  .tile.open .chev{transform:rotate(90deg);}

  .panel{max-height:0;overflow:hidden;transition:max-height .32s var(--ease);}
  .tile.open .panel{max-height:520px;}
  .panel-in{padding:2px 22px 22px;display:flex;flex-direction:column;gap:10px;}
  .chip{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--divider);border-radius:10px;
    opacity:0;transform:translateY(6px);}
  .tile.open .chip{animation:rise .34s var(--ease) forwards;animation-delay:calc(var(--i) * 45ms);}
  @keyframes rise{to{opacity:1;transform:none;}}
  .chip .cav{width:34px;height:34px;image-rendering:pixelated;flex:none;background:var(--field);border-radius:8px;padding:5px;}
  .chip .cnm{font-size:15px;font-weight:500;color:var(--head);flex:1;}
  .chip .eq{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warm-sand);}
  .acq{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px;border-radius:6px;border:none;background:var(--cta-bg);color:var(--cta-text);transition:transform .14s;}
  .acq:hover{transform:translateY(-1px);}.acq:active{transform:scale(.97);}
  .soon{font-size:13px;color:var(--muted);padding:6px 0;}

  .empty{padding:40px 0;color:var(--muted);font-size:15px;}

  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:14px 0;
    background:var(--chrome);backdrop-filter:blur(8px);border-top:1px solid var(--divider);font-size:13px;}
  .tabs span{color:var(--muted);}.tabs .active{color:var(--head);font-weight:600;}

  @media(max-width:820px){.grid{grid-template-columns:1fr;}.wrap{padding:32px 20px 110px;}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

  <header>
    <div class="word">VALUESKINS</div>
    <div class="nav">
      <a href="#">Profile</a><a href="#">Settings</a>
      <button class="b-quiet">Logout</button>
      <button class="b-quiet">Delete Account</button>
      <div class="toggle" onclick="toggleTheme()"><span id="tl">Light</span><span class="dw"><span class="kb"></span></span></div>
    </div>
  </header>

  <div class="wrap">
    <h1>ValueSkins Closet</h1>
    <p class="sub">Your identity skins — owned and available.</p>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#A08A5E" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Search professions…" oninput="filter()">
    </div>

    <div class="sl">Your Closet</div>
    <div class="closet" id="closet"></div>

    <div class="sl">Browse professions</div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <div class="tabs"><span>Profile</span><span>Market</span><span class="active">Store</span><span>Settings</span></div>

<script>
  // ---- pixel sprites (run-length rows in a 12x12 grid) ----
  const P={near:'#0A0A0A',char:'#2D2D2D',sand:'#A08A5E',warm:'#C8B89A',off:'#F5F5F0',mut:'#B8B4AC'};
  function sprite(rows,dark){ // rows: [x,y,w,color]
    const fig=dark?P.off:P.near, sec=dark?P.mut:P.char;
    const map={K:fig,C:sec,S:P.sand,W:P.warm,O:P.off};
    const r=rows.map(([x,y,w,c])=>`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${map[c]||c}"/>`).join('');
    return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
  }
  const S={
    dev:d=>sprite([[4,1,4,'K'],[3,2,6,'K'],[3,3,6,'C'],[4,4,4,'K'],[2,5,8,'C'],[1,6,10,'C'],[1,7,10,'K'],[2,8,8,'S'],[1,9,10,'S'],[3,10,6,'W']],d),
    chef:d=>sprite([[3,0,6,'O'],[3,1,6,'O'],[4,2,4,'K'],[4,3,4,'K'],[3,4,6,'C'],[2,5,8,'C'],[2,6,8,'C'],[3,7,6,'S'],[3,8,6,'S']],d),
    fit:d=>sprite([[1,4,2,'K'],[9,4,2,'K'],[1,5,2,'K'],[3,5,6,'C'],[9,5,2,'K'],[1,6,2,'K'],[3,6,6,'C'],[9,6,2,'K'],[1,7,2,'K'],[9,7,2,'K']],d),
    money:d=>sprite([[5,1,2,'W'],[4,2,4,'C'],[3,3,2,'C'],[5,3,3,'W'],[4,4,4,'C'],[7,5,2,'C'],[3,6,3,'W'],[4,6,4,'C'],[4,7,4,'C'],[5,8,2,'W']],d),
    person:d=>sprite([[4,1,4,'K'],[3,2,6,'K'],[4,3,4,'K'],[3,5,6,'C'],[2,6,8,'C'],[2,7,8,'C'],[2,8,8,'C']],d)
  };

  // ---- data ----
  const cats=[
    {name:'Technology',owned:1,skins:[{n:'App Developer',s:'dev',owned:true},{n:'AI / ML Engineer',s:'dev'},{n:'Product Designer',s:'person'},{n:'DevOps Engineer',s:'dev'}]},
    {name:'Food & Beverage',skins:[{n:'Chef / Restaurateur',s:'chef'},{n:'Home Baker',s:'chef'},{n:'Barista',s:'chef'}]},
    {name:'Health & Fitness',skins:[{n:'Personal Trainer',s:'fit'},{n:'Yoga Instructor',s:'fit'},{n:'Nutritionist',s:'person'}]},
    {name:'Finance & Insurance',skins:[{n:'Financial Advisor',s:'money'},{n:'Investing Educator',s:'money'}]},
    {name:'Retail & Shopping',skins:[{n:'Boutique Owner',s:'person'},{n:'Reseller',s:'person'}]},
    {name:'Beauty & Personal Care',skins:[{n:'MUA',s:'person'},{n:'Skincare Specialist',s:'person'}]},
    {name:'Fashion & Apparel',skins:[{n:'Stylist',s:'person'},{n:'Designer',s:'person'}]},
    {name:'Travel & Hospitality',skins:[{n:'Travel Creator',s:'person'}]},
    {name:'Entertainment & Media',skins:[{n:'Podcaster',s:'person'},{n:'Filmmaker',s:'person'}]},
    {name:'Sports & Recreation',skins:[{n:'Athlete',s:'fit'}]},
    {name:'Education',skins:[{n:'Tutor',s:'person'},{n:'Course Creator',s:'person'}]},
    {name:'Real Estate',skins:[{n:'Realtor',s:'person'}]},
    {name:'Professional Services',skins:[{n:'Consultant',s:'person'}]},
    {name:'Automotive',skins:[{n:'Auto Reviewer',s:'person'}]},
    {name:'Home & Garden',skins:[{n:'Interior Creator',s:'person'}]},
    {name:'Non-Profit & Community',skins:[{n:'Advocate',s:'person'}]},
  ];
  const isDark=()=>document.documentElement.getAttribute('data-theme')==='dark';

  function renderCloset(){
    const owned=[];
    cats.forEach(c=>c.skins&&c.skins.forEach(sk=>{if(sk.owned)owned.push({...sk,cat:c.name});}));
    const el=document.getElementById('closet');
    el.innerHTML=owned.map(o=>`
      <div class="skin-card">
        <div class="skin-av">${S[o.s](true)}</div>
        <div class="skin-meta"><div class="nm">${o.n}</div><div class="cat">${o.cat}</div>
          <div class="equipped"><span class="d"></span> Equipped</div></div>
      </div>`).join('') + `<div class="add-slot" onclick="document.getElementById('q').focus()">+ Wear another</div>`;
  }

  function renderGrid(list){
    const g=document.getElementById('grid'), empty=document.getElementById('empty');
    if(!list.length){g.innerHTML='';empty.style.display='block';empty.textContent=`No professions match "${document.getElementById('q').value}".`;return;}
    empty.style.display='none';
    g.innerHTML=list.map((c,ci)=>{
      const count=c.skins?c.skins.length:0;
      const chips=(c.skins||[]).map((sk,i)=>`
        <div class="chip" style="--i:${i}">
          <div class="cav">${S[sk.s](isDark())}</div>
          <div class="cnm">${sk.n}</div>
          ${sk.owned?'<span class="eq">Equipped</span>':'<button class="acq">Acquire</button>'}
        </div>`).join('') || '<div class="soon">Skins coming soon.</div>';
      return `<div class="tile ${c.owned?'owned':''}" data-i="${ci}">
        <div class="thead" onclick="toggleTile(this)">
          <span class="tname">${c.name}</span>
          <span class="tright">
            ${c.owned?'<span class="owned-badge"><span class="d"></span>'+c.owned+' owned</span>':''}
            <span class="tcount">${count} skin${count!==1?'s':''}</span>
            <span class="chev">›</span>
          </span>
        </div>
        <div class="panel"><div class="panel-in">${chips}</div></div>
      </div>`;
    }).join('');
  }
  function toggleTile(h){h.parentElement.classList.toggle('open');}
  function filter(){
    const q=document.getElementById('q').value.trim().toLowerCase();
    if(!q){renderGrid(cats);return;}
    const list=cats.map(c=>{
      const matchCat=c.name.toLowerCase().includes(q);
      const skins=(c.skins||[]).filter(s=>s.n.toLowerCase().includes(q));
      if(matchCat)return c;
      if(skins.length)return {...c,skins};
      return null;
    }).filter(Boolean);
    renderGrid(list);
  }
  function toggleTheme(){const el=document.documentElement;const d=isDark();el.setAttribute('data-theme',d?'light':'dark');
    document.getElementById('tl').textContent=d?'Light':'Dark';renderGrid(cats);filter();}

  renderCloset();renderGrid(cats);
</script>
</body>
</html>
